{% extends "base.html" %}

{% block title %}Albuns - Spotypobre {% endblock %}

{% block content %}
    <h2>Página de Albuns</h2>
    <section class="form-section">
        <h3>Cadastrar Novo Álbum</h3>
        <form action="{{ url_for('albuns.cadastro_album') }}" method="POST">
            <div class="">
                <label for="titulo">Título do Álbum:</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ex: Veneno Antimonotonia">
            </div>
            
            <div class="">
                <label for="ano">Ano de Lançamento:</label>
                <input type="number" id="ano" name="ano" placeholder="Ex: 1997">
            </div>

            <div class="">
                <label for="artistas">Artistas Participantes:</label>
                <select id="artistas" name="artistas_id">
                    {% for artista in artistas %}
                        <option value="{{ artista.id }}">{{ artista.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn">Salvar Álbum</button>
        </form>
   </section>
   <section>
        <h3>Álbuns Cadastrados</h3>

        {% for album in albuns %}
            <div class="card">
                <h4>{{ album.titulo }}</h4>
                <p>Ano: {{ album.ano }}</p>
            </div>
        {% else %}
            <p>Nenhum álbum foi cadastrado</p>
        {% endfor %}
    </section>

{% endblock %}
