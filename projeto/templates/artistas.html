
{% extends "base.html" %}

{% block title %} Artistas - Sistema de Música {% endblock %}

{% block content %}
    <h2>Página de Artistas</h2>

    <section class="form-section">
        <h3>Cadastrar Novo Artista</h3>
        <form action="{{ url_for('cadastro_artista') }}" method="POST">
            <div class="">
                <label for="nome">Nome do Artista:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Cássia Eller">
            </div>
            <button type="submit" class="btn">Salvar Artista</button>
        </form>
    </section>
{% endblock %}
