{% extends "base.html" %}

{% block title %}Faixas - Sistema de Música{% endblock %}

{% block content %}
    <h2>Página de Faixas</h2>

    <section class="form-section">
        <h3>Cadastrar Nova Faixa</h3>
        <form action="{{ url_for('cadastro_faixa') }}" method="POST">
            <div class="">
                <label for="titulo">Título da Faixa:</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ex: Por Enquanto">
            </div>

            <div class="">
                <label for="duracao">Duração (em segundos):</label>
                <input type="number" id="duracao" name="duracao_segundos" placeholder="Ex: 354">
            </div>

            <div class="card">
                <label for="album_id">Álbum Pertencente:</label>
                <select id="album_id" name="album_id">
                    <option value="">-- Selecione um Álbum --</option>
                    {% for album in albuns %}
                        <option value="{{ album.id }}">{{ album.titulo }} ({{ album.ano }})</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn">Salvar Faixa</button>
        </form>
</section>

{% endblock %}
